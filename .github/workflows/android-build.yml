name: Android build gate

# The compile/build verifier for the NeverSoft 11 launcher.
# This runner HAS the Android SDK and can reach Google Maven, so it provides
# the real red->green ./gradlew assembleDebug gate. (Device-level fidelity
# scoring still happens on a real phone — see README.)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint debug
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neversoft11-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
